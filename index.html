<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111111">
<meta name="description" content="Bike EMI Calculator">

<link rel="manifest" href="manifest.json">

<title>Bike EMI Calculator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f3f6;
    color: #111;
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    padding: 15px;
}

/* TOP BAR */
.topbar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
}

.menu-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 12px;
    background: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

/* HEADER */
.header {
    text-align: center;
    padding: 8px 0 22px;
}

.logo {
    width: 64px;
    height: 64px;
    margin: auto;
    border-radius: 18px;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
}

.header h1 {
    margin-top: 13px;
    font-size: 27px;
}

.header p {
    margin-top: 6px;
    color: #777;
    font-size: 14px;
}

/* CARD */
.card {
    background: white;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
}

.input-wrap {
    position: relative;
}

.rupee {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    font-weight: bold;
    color: #555;
}

input {
    width: 100%;
    height: 54px;
    border: 1.5px solid #d9dce1;
    border-radius: 12px;
    padding: 0 15px 0 40px;
    font-size: 18px;
    font-weight: 600;
    outline: none;
    background: #fff;
}

input:focus {
    border-color: #111;
}

/* DIFFERENCE */
.difference {
    margin-top: -5px;
    margin-bottom: 18px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #f5f6f7;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #666;
}

.difference strong {
    color: #111;
    font-size: 15px;
}

/* HYPO */
.hypo {
    height: 54px;
    border-radius: 12px;
    background: #f7f7f8;
    border: 1.5px solid #e1e2e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.hypo span:first-child {
    font-weight: 700;
}

.hypo span:last-child {
    font-size: 18px;
    font-weight: 800;
}

/* BUTTON */
.calculate {
    width: 100%;
    height: 55px;
    border: none;
    border-radius: 13px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
}

.calculate:active {
    transform: scale(.98);
}

.reset {
    width: 100%;
    margin-top: 10px;
    height: 45px;
    border: none;
    background: transparent;
    color: #555;
    font-weight: 700;
    cursor: pointer;
}

/* RESULT */
.result {
    display: none;
    margin-top: 20px;
}

.emi-card {
    background: #111;
    color: white;
    border-radius: 18px;
    padding: 23px 18px;
    text-align: center;
}

.emi-title {
    font-size: 13px;
    opacity: .75;
    text-transform: uppercase;
}

.emi {
    margin-top: 7px;
    font-size: 36px;
    font-weight: 900;
}

.per-month {
    font-size: 14px;
    opacity: .75;
    margin-top: 3px;
}

.cibil {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    color: #777;
}

/* ERROR */
.error {
    display: none;
    color: #c62828;
    background: #ffebee;
    padding: 10px 12px;
    border-radius: 9px;
    margin-bottom: 15px;
    font-size: 13px;
    font-weight: 600;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 18px 0;
    color: #999;
    font-size: 11px;
}

/* SIDE MENU */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 90;
}

.overlay.show {
    display: block;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    max-width: 85%;
    height: 100vh;
    background: white;
    z-index: 100;
    padding: 22px;
    transition: .3s ease;
    box-shadow: 8px 0 25px rgba(0,0,0,.15);
}

.side-menu.open {
    left: 0;
}

.menu-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
}

.menu-header h2 {
    font-size: 21px;
}

.close-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #f1f2f4;
    font-size: 20px;
    cursor: pointer;
}

.menu-section {
    border-top: 1px solid #eee;
    padding-top: 20px;
}

.menu-section h3 {
    font-size: 16px;
    margin-bottom: 18px;
}

.setting {
    margin-bottom: 18px;
}

.setting label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.setting input {
    height: 48px;
    padding-left: 15px;
    font-size: 16px;
}

.save-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 11px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.saved-message {
    display: none;
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: #2e7d32;
    font-weight: 700;
}

@media (max-width:380px) {
    .app {
        padding: 12px;
    }

    .card {
        padding: 18px;
    }

    .header h1 {
        font-size: 24px;
    }

    .emi {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<!-- SIDE MENU -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="side-menu" id="sideMenu">

    <div class="menu-header">
        <h2>☰ Main Menu</h2>

        <button class="close-btn" onclick="closeMenu()">✕</button>
    </div>

    <div class="menu-section">

        <h3>⚙️ EMI Settings</h3>

        <div class="setting">
            <label>Processing Fee</label>

            <input
                type="number"
                id="processingFee"
                min="0"
                inputmode="numeric"
            >
        </div>

        <div class="setting">
            <label>Interest Rate (% per 12 months)</label>

            <input
                type="number"
                id="interestRate"
                min="0"
                step="0.01"
                inputmode="decimal"
            >
        </div>

        <button class="save-btn" onclick="saveSettings()">
            SAVE SETTINGS
        </button>

        <div class="saved-message" id="savedMessage">
            ✓ Settings Saved
        </div>

    </div>

</div>


<div class="app">

    <!-- TOP MENU -->
    <div class="topbar">
        <button class="menu-btn" onclick="openMenu()">☰</button>
    </div>


    <!-- HEADER -->
    <div class="header">

        <div class="logo">🏍️</div>

        <h1>Bike EMI Calculator</h1>

        <p>Calculate your approximate monthly EMI</p>

    </div>


    <div class="card">

        <div class="error" id="error"></div>


        <!-- ON ROAD PRICE -->
        <div class="field">

            <label>ON ROAD PRICE</label>

            <div class="input-wrap">

                <span class="rupee">₹</span>

                <input
                    type="number"
                    id="onRoadPrice"
                    placeholder="Enter on road price"
                    min="1"
                    inputmode="numeric"
                >

            </div>

        </div>


        <!-- DP -->
        <div class="field">

            <label>DOWN PAYMENT (DP)</label>

            <div class="input-wrap">

                <span class="rupee">₹</span>

                <input
                    type="number"
                    id="downPayment"
                    placeholder="Enter down payment"
                    min="0"
                    inputmode="numeric"
                >

            </div>

        </div>


        <!-- PRICE - DP -->
        <div class="difference">

            <span>On Road Price − DP</span>

            <strong id="difference">₹0</strong>

        </div>


        <!-- HYPO -->
        <div class="field">

            <label>HYPO</label>

            <div class="hypo">

                <span>Hypothecation Charges</span>

                <span>₹500</span>

            </div>

        </div>


        <!-- TENURE -->
        <div class="field">

            <label>TENURE</label>

            <div class="input-wrap">

                <input
                    type="number"
                    id="tenure"
                    placeholder="Enter months"
                    min="1"
                    max="120"
                    inputmode="numeric"
                    style="padding-left:15px;"
                >

            </div>

            <div style="
                margin-top:6px;
                color:#777;
                font-size:12px;
            ">
                Enter tenure in months
            </div>

        </div>


        <!-- CALCULATE -->
        <button class="calculate" onclick="calculateEMI()">
            CALCULATE EMI
        </button>


        <button class="reset" onclick="resetCalculator()">
            Reset
        </button>


        <!-- RESULT -->
        <div class="result" id="result">

            <div class="emi-card">

                <div class="emi-title">
                    Approx EMI
                </div>

                <div class="emi" id="emi">
                    ₹0
                </div>

                <div class="per-month">
                    per month
                </div>

            </div>

            <div class="cibil">
                Approx EMI according to your CIBIL
            </div>

        </div>

    </div>


    <div class="footer">
        Bike EMI Calculator
    </div>

</div>


<script>

/*
==================================================
DEFAULT SETTINGS
==================================================

Processing Fee = ₹6,000
Interest = 8% per 12 months
Hypo = ₹500

These settings can be changed from Main Menu.
==================================================
*/

const DEFAULT_PROCESSING_FEE = 6000;
const DEFAULT_INTEREST_RATE = 8;
const HYPO = 500;


/* GET SAVED SETTINGS */

function getProcessingFee() {

    const saved =
        localStorage.getItem("processingFee");

    return saved !== null
        ? Number(saved)
        : DEFAULT_PROCESSING_FEE;

}


function getInterestRate() {

    const saved =
        localStorage.getItem("interestRate");

    return saved !== null
        ? Number(saved)
        : DEFAULT_INTEREST_RATE;

}


/* OPEN MENU */

function openMenu() {

    document
        .getElementById("sideMenu")
        .classList.add("open");

    document
        .getElementById("overlay")
        .classList.add("show");

}


/* CLOSE MENU */

function closeMenu() {

    document
        .getElementById("sideMenu")
        .classList.remove("open");

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* LOAD SETTINGS */

function loadSettings() {

    document.getElementById("processingFee").value =
        getProcessingFee();

    document.getElementById("interestRate").value =
        getInterestRate();

}


/* SAVE SETTINGS */

function saveSettings() {

    const processingFee =
        Number(
            document.getElementById("processingFee").value
        );

    const interestRate =
        Number(
            document.getElementById("interestRate").value
        );


    if (processingFee < 0) {

        alert("Please enter a valid Processing Fee.");

        return;

    }


    if (interestRate < 0) {

        alert("Please enter a valid Interest Rate.");

        return;

    }


    localStorage.setItem(
        "processingFee",
        processingFee
    );


    localStorage.setItem(
        "interestRate",
        interestRate
    );


    const message =
        document.getElementById("savedMessage");

    message.style.display = "block";


    setTimeout(() => {

        message.style.display = "none";

    }, 2000);

}


/* RUPEE FORMAT */

function formatRupee(amount) {

    return "₹" +
        Math.round(amount)
            .toLocaleString("en-IN");

}


/* ON ROAD PRICE - DP */

function updateDifference() {

    const price =
        Number(
            document.getElementById("onRoadPrice").value
        ) || 0;

    const dp =
        Number(
            document.getElementById("downPayment").value
        ) || 0;


    const difference =
        price - dp;


    document.getElementById("difference").textContent =
        formatRupee(
            Math.max(difference, 0)
        );

}


/* CALCULATE EMI */

function calculateEMI() {

    const price =
        Number(
            document.getElementById("onRoadPrice").value
        );

    const dp =
        Number(
            document.getElementById("downPayment").value
        );

    const tenure =
        Number(
            document.getElementById("tenure").value
        );


    const errorBox =
        document.getElementById("error");

    errorBox.style.display = "none";


    /* VALIDATION */

    if (!price || price <= 0) {

        showError(
            "Please enter On Road Price."
        );

        return;

    }


    if (dp < 0 || dp >= price) {

        showError(
            "DP must be less than On Road Price."
        );

        return;

    }


    if (!tenure || tenure <= 0) {

        showError(
            "Please enter Tenure in months."
        );

        return;

    }


    if (tenure > 120) {

        showError(
            "Tenure cannot be more than 120 months."
        );

        return;

    }


    /* GET CURRENT SETTINGS */

    const processingFee =
        getProcessingFee();

    const interestRate =
        getInterestRate() / 100;


    /*
    ================================================
    FINANCE AMOUNT

    On Road Price
    - DP
    + Hypo ₹500
    + Processing Fee
    ================================================
    */

    const financeAmount =
        price -
        dp +
        HYPO +
        processingFee;


    /*
    ================================================
    INTEREST

    Example:

    12 months = 8%
    24 months = 16%
    30 months = 20%

    ================================================
    */

    const interest =
        financeAmount *
        interestRate *
        (tenure / 12);


    /* TOTAL */

    const totalRepayment =
        financeAmount +
        interest;


    /* EMI */

    const emi =
        totalRepayment /
        tenure;


    /* SHOW EMI */

    document.getElementById("emi").textContent =
        formatRupee(emi);


    document.getElementById("result").style.display =
        "block";


    updateDifference();

}


/* ERROR */

function showError(message) {

    const errorBox =
        document.getElementById("error");

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* RESET */

function resetCalculator() {

    document.getElementById("onRoadPrice").value = "";

    document.getElementById("downPayment").value = "";

    document.getElementById("tenure").value = "";

    document.getElementById("difference").textContent =
        "₹0";

    document.getElementById("emi").textContent =
        "₹0";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("error").style.display =
        "none";

}


/* LIVE PRICE - DP */

document
    .getElementById("onRoadPrice")
    .addEventListener(
        "input",
        updateDifference
    );


document
    .getElementById("downPayment")
    .addEventListener(
        "input",
        updateDifference
    );


/* LOAD SETTINGS ON START */

loadSettings();


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("service-worker.js")
                .catch(
                    function(error) {

                        console.log(
                            "Service Worker error:",
                            error
                        );

                    }
                );

        }
    );

}

</script>

</body>
    </html
