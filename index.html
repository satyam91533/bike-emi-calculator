<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#111111">
    <meta name="description" content="Bike EMI Calculator">

    <link rel="manifest" href="manifest.json">

    <title>Bike EMI Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f6;
            color: #111;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            max-width: 480px;
            margin: auto;
            min-height: 100vh;
            padding: 18px;
        }

        .header {
            text-align: center;
            padding: 20px 0 22px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: auto;
            border-radius: 18px;
            background: #111;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .header h1 {
            margin-top: 14px;
            font-size: 27px;
        }

        .header p {
            margin-top: 6px;
            color: #777;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .rupee {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            height: 54px;
            border: 1.5px solid #d9dce1;
            border-radius: 12px;
            padding: 0 15px 0 40px;
            font-size: 18px;
            font-weight: 600;
            outline: none;
            background: #fff;
        }

        input:focus {
            border-color: #111;
        }

        .tenure-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tenure-wrap input {
            padding-left: 15px;
        }

        .months {
            min-width: 82px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f2f4;
            border-radius: 12px;
            font-weight: 700;
        }

        .hypo {
            height: 54px;
            border-radius: 12px;
            background: #f7f7f8;
            border: 1.5px solid #e1e2e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .hypo span:first-child {
            font-weight: 700;
        }

        .hypo span:last-child {
            font-size: 18px;
            font-weight: 800;
        }

        .difference {
            margin-top: -5px;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f5f6f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .difference strong {
            color: #111;
            font-size: 15px;
        }

        .calculate {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 13px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .calculate:active {
            transform: scale(0.98);
        }

        .reset {
            width: 100%;
            margin-top: 10px;
            height: 45px;
            border: none;
            background: transparent;
            color: #555;
            font-weight: 700;
            cursor: pointer;
        }

        .result {
            display: none;
            margin-top: 20px;
        }

        .emi-card {
            background: #111;
            color: white;
            border-radius: 18px;
            padding: 23px 18px;
            text-align: center;
        }

        .emi-title {
            font-size: 13px;
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .emi {
            margin-top: 7px;
            font-size: 36px;
            font-weight: 900;
        }

        .per-month {
            font-size: 14px;
            opacity: 0.75;
        }

        .cibil {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }

        .error {
            display: none;
            color: #c62828;
            background: #ffebee;
            padding: 10px 12px;
            border-radius: 9px;
            margin-bottom: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding: 18px 0;
            color: #999;
            font-size: 11px;
        }

        @media (max-width: 380px) {
            .app {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .header h1 {
                font-size: 24px;
            }

            .emi {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🏍️</div>
        <h1>Bike EMI Calculator</h1>
        <p>Calculate your approximate monthly EMI</p>
    </div>

    <div class="card">

        <div class="error" id="error"></div>

        <!-- ON ROAD PRICE -->
        <div class="field">
            <label>ON ROAD PRICE</label>

            <div class="input-wrap">
                <span class="rupee">₹</span>
                <input
                    type="number"
                    id="onRoadPrice"
                    placeholder="Enter on road price"
                    min="1"
                    inputmode="numeric"
                >
            </div>
        </div>

        <!-- DP -->
        <div class="field">
            <label>DOWN PAYMENT (DP)</label>

            <div class="input-wrap">
                <span class="rupee">₹</span>
                <input
                    type="number"
                    id="downPayment"
                    placeholder="Enter down payment"
                    min="0"
                    inputmode="numeric"
                >
            </div>
        </div>

        <!-- PRICE - DP -->
        <div class="difference" id="differenceBox">
            <span>On Road Price − DP</span>
            <strong id="difference">₹0</strong>
        </div>

        <!-- HYPO -->
        <div class="field">
            <label>HYPO</label>

            <div class="hypo">
                <span>Hypothecation Charges</span>
                <span>₹500</span>
            </div>
        </div>

        <!-- TENURE -->
        <div class="field">
            <label>TENURE</label>

            <div class="tenure-wrap">
                <input
                    type="number"
                    id="tenure"
                    placeholder="Enter months"
                    min="1"
                    max="120"
                    inputmode="numeric"
                >

                <div class="months">Months</div>
            </div>
        </div>

        <button class="calculate" onclick="calculateEMI()">
            CALCULATE EMI
        </button>

        <button class="reset" onclick="resetCalculator()">
            Reset
        </button>

        <!-- RESULT -->
        <div class="result" id="result">

            <div class="emi-card">
                <div class="emi-title">Approx EMI</div>

                <div class="emi" id="emi">
                    ₹0
                </div>

                <div class="per-month">
                    per month
                </div>
            </div>

            <div class="cibil">
                Approx EMI according to your CIBIL
            </div>

        </div>

    </div>

    <div class="footer">
        Bike EMI Calculator
    </div>

</div>


<script>

    /*
        ================================
        HIDDEN FINANCE SETTINGS
        ================================

        Processing Fee = ₹6,000
        Interest = 8% per 12 months
        Hypo = ₹500
    */

    const PROCESSING_FEE = 6000;
    const INTEREST_RATE = 0.08;
    const HYPO = 500;


    // Format amount in Indian currency
    function formatRupee(amount) {

        return "₹" + Math.round(amount).toLocaleString("en-IN");

    }


    // Update ON ROAD PRICE - DP live
    function updateDifference() {

        const price =
            Number(document.getElementById("onRoadPrice").value) || 0;

        const dp =
            Number(document.getElementById("downPayment").value) || 0;

        const difference = price - dp;

        document.getElementById("difference").textContent =
            formatRupee(Math.max(difference, 0));

    }


    // Calculate EMI
    function calculateEMI() {

        const price =
            Number(document.getElementById("onRoadPrice").value);

        const dp =
            Number(document.getElementById("downPayment").value);

        const tenure =
            Number(document.getElementById("tenure").value);

        const errorBox =
            document.getElementById("error");

        errorBox.style.display = "none";


        // Validation
        if (!price || price <= 0) {

            showError("Please enter On Road Price.");
            return;

        }


        if (dp < 0 || dp >= price) {

            showError("DP must be less than On Road Price.");
            return;

        }


        if (!tenure || tenure <= 0) {

            showError("Please enter Tenure in months.");
            return;

        }


        if (tenure > 120) {

            showError("Tenure cannot be more than 120 months.");
            return;

        }


        /*
            FINANCE AMOUNT

            On Road Price
            - Down Payment
            + Hypo ₹500
            + Processing Fee ₹6,000
        */

        const financeAmount =
            price - dp + HYPO + PROCESSING_FEE;


        /*
            INTEREST

            8% for every 12 months

            Example:
            12 months = 8%
            24 months = 16%
            30 months = 20%
        */

        const interest =
            financeAmount *
            INTEREST_RATE *
            (tenure / 12);


        // Total repayment
        const totalRepayment =
            financeAmount + interest;


        // Monthly EMI
        const emi =
            totalRepayment / tenure;


        // Display EMI
        document.getElementById("emi").textContent =
            formatRupee(emi);


        document.getElementById("result").style.display =
            "block";


        // Update difference
        updateDifference();

    }


    // Show error
    function showError(message) {

        const errorBox =
            document.getElementById("error");

        errorBox.textContent = message;
        errorBox.style.display = "block";

    }


    // Reset
    function resetCalculator() {

        document.getElementById("onRoadPrice").value = "";
        document.getElementById("downPayment").value = "";
        document.getElementById("tenure").value = "";

        document.getElementById("difference").textContent =
            "₹0";

        document.getElementById("emi").textContent =
            "₹0";

        document.getElementById("result").style.display =
            "none";

        document.getElementById("error").style.display =
            "none";

    }


    // Live update when price or DP changes
    document.getElementById("onRoadPrice")
        .addEventListener("input", updateDifference);

    document.getElementById("downPayment")
        .addEventListener("input", updateDifference);


    // Register offline service worker
    if ("serviceWorker" in navigator) {

        window.addEventListener("load", function () {

            navigator.serviceWorker.register("service-worker.js")
                .catch(function (error) {

                    console.log(
                        "Service Worker registration failed:",
                        error
                    );

                });

        });

    }

</script>

</body>
</html>
